<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="artBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#151226"/>
      <stop offset="100%" stop-color="#24133b"/>
    </linearGradient>
    <linearGradient id="poster1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="poster2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="poster3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#artBg)"/>

  <!-- Creative glowing sparks -->
  <circle cx="220" cy="140" r="120" fill="#ec4899" opacity="0.12"/>
  <circle cx="580" cy="280" r="140" fill="#8b5cf6" opacity="0.15"/>

  <!-- Left: Big Artboard Poster Mockup -->
  <g transform="translate(80, 50)">
    <rect width="260" height="350" rx="16" fill="#131124" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <rect x="15" y="15" width="230" height="230" rx="12" fill="url(#poster1)"/>
    
    <!-- Abstract shapes on poster -->
    <circle cx="130" cy="130" r="65" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="6"/>
    <polygon points="130,85 170,165 90,165" fill="rgba(255,255,255,0.25)"/>
    <text x="130" y="138" font-family="system-ui, sans-serif" font-size="20" fill="#ffffff" font-weight="900" text-anchor="middle" letter-spacing="2">INNOVATE</text>
    <text x="130" y="156" font-family="system-ui, sans-serif" font-size="10" fill="rgba(255,255,255,0.8)" text-anchor="middle">CREATIVE BRAND DESIGN</text>
    
    <!-- Poster Caption area -->
    <rect x="15" y="260" width="160" height="12" rx="4" fill="#e2e8f0"/>
    <rect x="15" y="280" width="210" height="8" rx="4" fill="#64748b"/>
    <rect x="15" y="296" width="140" height="8" rx="4" fill="#64748b"/>
    <rect x="15" y="318" width="70" height="18" rx="9" fill="#8b5cf6"/>
    <text x="50" y="330" font-family="system-ui, sans-serif" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">Typography</text>
    <rect x="95" y="318" width="65" height="18" rx="9" fill="#ec4899"/>
    <text x="127" y="330" font-family="system-ui, sans-serif" font-size="8" fill="#fff" text-anchor="middle" font-weight="bold">Storytelling</text>
  </g>

  <!-- Middle Poster Card: Tech & Minimalist -->
  <g transform="translate(370, 70)">
    <rect width="180" height="240" rx="14" fill="#131929" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="12" y="12" width="156" height="150" rx="8" fill="url(#poster2)"/>
    <circle cx="90" cy="85" r="40" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="90" y="90" font-family="system-ui, sans-serif" font-size="13" fill="#ffffff" font-weight="800" text-anchor="middle">DIGITAL B2B</text>
    <rect x="12" y="174" width="110" height="10" rx="4" fill="#f8fafc"/>
    <rect x="12" y="190" width="140" height="6" rx="3" fill="#64748b"/>
    <rect x="12" y="206" width="60" height="16" rx="8" fill="#06b6d4" fill-opacity="0.2"/>
    <text x="42" y="217" font-family="system-ui, sans-serif" font-size="8" fill="#22d3ee" font-weight="bold" text-anchor="middle">Infographic</text>
  </g>

  <!-- Bottom Floating Palette Card -->
  <g transform="translate(370, 330)">
    <rect width="360" height="70" rx="12" fill="#14192b" stroke="rgba(255,255,255,0.1)"/>
    <text x="16" y="24" font-family="system-ui, sans-serif" font-size="11" fill="#fff" font-weight="bold">Brand Color Palette & Visual Assets</text>
    <circle cx="26" cy="46" r="14" fill="#8b5cf6"/>
    <circle cx="62" cy="46" r="14" fill="#ec4899"/>
    <circle cx="98" cy="46" r="14" fill="#06b6d4"/>
    <circle cx="134" cy="46" r="14" fill="#3b82f6"/>
    <circle cx="170" cy="46" r="14" fill="#10b981"/>
    <text x="210" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Consistent Brand Voice & Aesthetic</text>
  </g>

  <!-- Right Poster Card: Promotional Flyer -->
  <g transform="translate(575, 45)">
    <rect width="155" height="260" rx="14" fill="#1b1728" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
    <rect x="10" y="10" width="135" height="160" rx="8" fill="url(#poster3)"/>
    <text x="77" y="80" font-family="system-ui, sans-serif" font-size="16" fill="#fff" font-weight="bold" text-anchor="middle">SPECIAL</text>
    <text x="77" y="100" font-family="system-ui, sans-serif" font-size="12" fill="#fff" font-weight="bold" text-anchor="middle">OFFER</text>
    <rect x="35" y="115" width="85" height="20" rx="10" fill="#fff"/>
    <text x="77" y="129" font-family="system-ui, sans-serif" font-size="9" fill="#ef4444" font-weight="900" text-anchor="middle">50% DISCOUNT</text>

    <rect x="10" y="182" width="100" height="10" rx="4" fill="#f8fafc"/>
    <rect x="10" y="200" width="125" height="6" rx="3" fill="#64748b"/>
    <rect x="10" y="218" width="55" height="16" rx="8" fill="#ef4444" fill-opacity="0.2"/>
    <text x="37" y="229" font-family="system-ui, sans-serif" font-size="8" fill="#f87171" font-weight="bold" text-anchor="middle">Promotional</text>
  </g>
</svg>
