<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="metaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#14192b"/>
    </linearGradient>
    <linearGradient id="metaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0064e0"/>
      <stop offset="50%" stop-color="#0099ff"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#metaBg)"/>

  <!-- Glows -->
  <circle cx="200" cy="180" r="140" fill="#0064e0" opacity="0.15"/>
  <circle cx="620" cy="260" r="130" fill="#8b5cf6" opacity="0.12"/>

  <!-- Main Ads Manager Container -->
  <rect x="80" y="45" width="640" height="360" rx="16" fill="#131b2e" stroke="rgba(255,255,255,0.12)" stroke-width="1.5"/>

  <!-- Top Bar -->
  <rect x="80" y="45" width="640" height="44" rx="16" fill="#1a233a"/>
  <!-- Meta Logo Icon -->
  <path d="M 115 67 C 111 60, 105 60, 102 65 C 99 70, 103 76, 108 76 C 113 76, 117 70, 120 65 C 123 60, 127 60, 130 65 C 133 70, 129 76, 124 76 C 119 76, 116 71, 115 67 Z" fill="none" stroke="#0080fb" stroke-width="3" stroke-linecap="round"/>
  <text x="145" y="72" font-family="system-ui, sans-serif" font-size="14" fill="#f8fafc" font-weight="700">Meta Ads Manager</text>
  <rect x="290" y="58" width="80" height="20" rx="10" fill="#22c55e" fill-opacity="0.15"/>
  <text x="330" y="72" font-family="system-ui, sans-serif" font-size="10" fill="#4ade80" font-weight="600" text-anchor="middle">ACTIVE CAMPAIGN</text>

  <!-- Left Sidebar Mockup -->
  <rect x="95" y="105" width="160" height="280" rx="10" fill="#182238" stroke="rgba(255,255,255,0.06)"/>
  <text x="110" y="130" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" font-weight="bold">CAMPAIGN OBJECTIVE</text>
  <rect x="110" y="142" width="130" height="26" rx="6" fill="#0080fb" fill-opacity="0.2" stroke="#0080fb" stroke-width="1"/>
  <text x="120" y="159" font-family="system-ui, sans-serif" font-size="11" fill="#60a5fa" font-weight="600">🎯 Leads & Conversions</text>

  <text x="110" y="195" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" font-weight="bold">TARGET AUDIENCE</text>
  <rect x="110" y="206" width="130" height="52" rx="6" fill="#1e293b"/>
  <text x="118" y="222" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">• Age: 22 - 45 Years</text>
  <text x="118" y="236" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">• Geo: Kerala / Calicut</text>
  <text x="118" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#e2e8f0">• Interests: Business & Tech</text>

  <text x="110" y="285" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8" font-weight="bold">PLACEMENTS</text>
  <rect x="110" y="295" width="130" height="24" rx="6" fill="#1e293b"/>
  <text x="120" y="311" font-family="system-ui, sans-serif" font-size="10" fill="#c084fc">Instagram Feed & Reels</text>
  <rect x="110" y="325" width="130" height="24" rx="6" fill="#1e293b"/>
  <text x="120" y="341" font-family="system-ui, sans-serif" font-size="10" fill="#38bdf8">Facebook Feed & Stories</text>

  <!-- Right Performance Metrics & Ad Preview -->
  <!-- Stat 1: Impressions -->
  <rect x="270" y="105" width="130" height="75" rx="10" fill="#182238" stroke="rgba(255,255,255,0.06)"/>
  <text x="285" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Impressions</text>
  <text x="285" y="148" font-family="system-ui, sans-serif" font-size="18" fill="#fff" font-weight="bold">124,800</text>
  <text x="285" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">▲ 32% vs Last Mo</text>

  <!-- Stat 2: Click Through Rate -->
  <rect x="415" y="105" width="130" height="75" rx="10" fill="#182238" stroke="rgba(255,255,255,0.06)"/>
  <text x="430" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Avg. CTR</text>
  <text x="430" y="148" font-family="system-ui, sans-serif" font-size="18" fill="#38bdf8" font-weight="bold">3.85%</text>
  <text x="430" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">High Relevance</text>

  <!-- Stat 3: Cost Per Lead -->
  <rect x="560" y="105" width="145" height="75" rx="10" fill="#182238" stroke="rgba(255,255,255,0.06)"/>
  <text x="575" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Cost Per Result (CPL)</text>
  <text x="575" y="148" font-family="system-ui, sans-serif" font-size="18" fill="#a855f7" font-weight="bold">₹28.40</text>
  <text x="575" y="166" font-family="system-ui, sans-serif" font-size="9" fill="#34d399">Optimized Funnel</text>

  <!-- Ad Creative Preview Section -->
  <rect x="270" y="195" width="435" height="190" rx="12" fill="#182238" stroke="rgba(255,255,255,0.06)"/>
  <!-- Mini Ad Card -->
  <rect x="290" y="210" width="130" height="160" rx="8" fill="#0f172a" stroke="rgba(0,140,255,0.3)"/>
  <rect x="295" y="215" width="120" height="90" rx="6" fill="url(#metaGrad)"/>
  <circle cx="355" cy="250" r="18" fill="rgba(255,255,255,0.2)"/>
  <text x="355" y="255" font-family="system-ui, sans-serif" font-size="14" fill="#fff" text-anchor="middle">⚡</text>
  <text x="355" y="280" font-family="system-ui, sans-serif" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">Grow Your Brand</text>
  <text x="302" y="322" font-family="system-ui, sans-serif" font-size="8" fill="#e2e8f0" font-weight="bold">Sponsored Ad</text>
