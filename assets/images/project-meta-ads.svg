  <text x="355" y="350" font-family="system-ui, sans-serif" font-size="9" fill="#fff" font-weight="bold" text-anchor="middle">Learn More</text>

  <!-- Funnel Chart Breakdown -->
  <text x="440" y="222" font-family="system-ui, sans-serif" font-size="12" fill="#fff" font-weight="bold">Funnel Performance</text>
  <!-- Bar 1 -->
  <rect x="440" y="238" width="245" height="18" rx="4" fill="#1e293b"/>
  <rect x="440" y="238" width="220" height="18" rx="4" fill="#0080fb"/>
  <text x="450" y="251" font-family="system-ui, sans-serif" font-size="9" fill="#fff">Ad Reach (100%)</text>
  
  <!-- Bar 2 -->
  <rect x="440" y="266" width="245" height="18" rx="4" fill="#1e293b"/>
  <rect x="440" y="266" width="150" height="18" rx="4" fill="#06b6d4"/>
  <text x="450" y="279" font-family="system-ui, sans-serif" font-size="9" fill="#fff">Landing Page Clicks (68%)</text>

  <!-- Bar 3 -->
  <rect x="440" y="294" width="245" height="18" rx="4" fill="#1e293b"/>
  <rect x="440" y="294" width="95" height="18" rx="4" fill="#8b5cf6"/>
  <text x="450" y="307" font-family="system-ui, sans-serif" font-size="9" fill="#fff">Qualified Inquiries (42%)</text>

  <!-- Bottom Badge -->
  <rect x="440" y="330" width="245" height="36" rx="6" fill="#1e293b"/>
  <text x="455" y="348" font-family="system-ui, sans-serif" font-size="10" fill="#a5b4fc" font-weight="bold">A/B Testing: Video Creative won (+45% Leads)</text>
  <text x="455" y="358" font-family="system-ui, sans-serif" font-size="8" fill="#94a3b8">Audience Retargeting Pixel Active</text>
</svg>
